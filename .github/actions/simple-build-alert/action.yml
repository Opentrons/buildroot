name: 'Simple Build Alert'
description: 'Sends Slack alerts for tagged build failures with clear links'

inputs:
  status:
    description: 'Build status: success, failure, or cancelled'
    required: true
  workflow_name:
    description: 'Name of the workflow'
    required: true
  failed_jobs:
    description: 'Comma-separated list of failed jobs (optional)'
    required: false
  webhook_url:
    description: 'Slack webhook URL'
    required: true
  console_url:
    description: 'S3 console URL (optional)'
    required: false
  system_url:
    description: 'System update zip URL (optional)'
    required: false
  fullimage_url:
    description: 'Full image zip URL (optional)'
    required: false
  version_file_url:
    description: 'Version file URL (optional)'
    required: false
  release_notes_file_url:
    description: 'Release notes file URL (optional)'
    required: false
  buildroot_ref:
    description: 'Buildroot ref (optional)'
    required: false
  monorepo_ref:
    description: 'Monorepo ref (optional)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: 'Prepare refs for payload'
      id: prepare-refs
      shell: bash
      run: |
        # Strip refs/tags/ or refs/heads/ prefix from refs
        buildroot_display="${{ inputs.buildroot_ref }}"
        buildroot_display="${buildroot_display#refs/tags/}"
        buildroot_display="${buildroot_display#refs/heads/}"
        echo "buildroot=${buildroot_display}" >> $GITHUB_OUTPUT
        
        monorepo_display="${{ inputs.monorepo_ref }}"
        monorepo_display="${monorepo_display#refs/tags/}"
        monorepo_display="${monorepo_display#refs/heads/}"
        echo "monorepo=${monorepo_display}" >> $GITHUB_OUTPUT
        
        # Determine if this is a tagged release
        if [[ "${{ inputs.monorepo_ref }}" == refs/tags/* ]]; then
          echo "ref_type=tag" >> $GITHUB_OUTPUT
        else
          echo "ref_type=branch" >> $GITHUB_OUTPUT
        fi

    - name: 'Send Slack Alert'
      uses: slackapi/slack-github-action@d09f6a279ff492756a31df59952ee6dce8c9b772 # v1.14.0
      with:
        payload: "{\"s3-url\":\"${{ inputs.console_url }}/\",\"type\":\"${{ steps.prepare-refs.outputs.ref_type }}\",\"reflike\":\"${{ steps.prepare-refs.outputs.buildroot }}\",\"monorepo-reflike\":\"${{ steps.prepare-refs.outputs.monorepo }}\",\"full-image\":\"${{ inputs.fullimage_url }}\",\"system-update\":\"${{ inputs.system_url }}\",\"version-file\":\"${{ inputs.version_file_url }}\",\"release-notes\":\"${{ inputs.release_notes_file_url }}\"}"
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook_url }}
      continue-on-error: false
