name: "Set AWS credentials for robot-stack (OIDC)"
description: |
  Assume an IAM role using GitHub Actions OIDC. Configure repository Variables
  ROBOT_STACK_AWS_OIDC_ROLE_ARN_DEV and ROBOT_STACK_AWS_OIDC_ROLE_ARN_PROD (see workflow).
  The target IAM role must trust token.actions.githubusercontent.com and allow a session
  duration long enough for the build (see role-duration-seconds).
inputs:
  role-to-assume:
    description: "IAM role ARN to assume (GitHub OIDC trust)"
    required: true
  aws-region:
    description: "AWS region for CLI and SDK calls"
    required: false
    default: "us-east-2"
  role-duration-seconds:
    description: "STS session length; must be <= the role's MaxSessionDuration in IAM"
    required: false
    default: "43200"
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
