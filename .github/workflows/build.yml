name: 'Build OT2 image on github workflows'
run-name: 'image: mono ${{ inputs.monorepo-ref }}, buildroot ${{ inputs.buildroot-ref }}'
on:
  workflow_dispatch:
    inputs:
      monorepo-ref:
        description: |
          Ref of https://github.com/opentrons/opentrons or https://github.com/opentrons/opentrons-ot2 to build. This MUST be a full ref, e.g. refs/heads/edge, or '-' to indicate not-specified. If not specified, will be determined from the oe-core ref if specified, and then default to edge.
        required: true
        default: '-'
        type: string
      monorepo-is-fork:
        description: |
          Whether the monorepo-ref refers to https://github.com/opentrons/opentrons (false, the default) or https://github.com/opentrons/opentrons-ot2 (true, must be explicitly selected)
        required: false
        default: false
        type: boolean
      buildroot-ref:
        description: |
          Ref of https://github.com/opentrons/buildroot to build. This is different from the ref specified in the github api/webUI when starting this workflow - that ref is what contains this workflow, this ref specifies what gets built. It MUST be a full ref, e.g. refs/heads/main, or '-' to indicate not-specified. If not specified, will be decided based on the monorepo ref; if that isn't specified, will be main.
        required: true
        default: '-'
        type: string
      infra-stage:
        description: |
          What infra stage to run on. This should almost always be prod; dev is useful when you explicitly want to test that stage.
        required: true
        type: choice
        options:
          - 'stage-prod'
          - 'stage-dev'
        default: 'stage-prod'
      force-own-container:
        description: |
          True to build a container from the source branch and use that instead of a ghcr pull. Useful in development.
        required: false
        default: false
        type: boolean
      force-ephemeral-infra:
        description: |
          Use ephemeral builder infrastructure, even if this is a non-fork build.
        required: false
        default: false
        type: boolean
      runner-request-max-attempts:
        description: |
          Maximum number of retries when requesting an ephemeral runner after 429 capacity responses.
        required: false
        default: 120
        type: number
      runner-request-retry-seconds:
        description: |
          Seconds to wait between ephemeral runner request retries on 429 capacity responses.
        required: false
        default: 60
        type: number

env:
  CI: true

jobs:
  decide-refs:
    name: 'Decide refs to build'
    runs-on: 'ubuntu-latest'
    outputs:
      buildroot: ${{ steps.build-refs.outputs.buildroot }}
      monorepo: ${{ steps.build-refs.outputs.monorepo }}
      variant: ${{ steps.build-refs.outputs.variant }}
      build-type: ${{ steps.build-refs.outputs.build-type }}
      monorepo-repo: ${{ steps.build-refs.outputs.monorepo-repo }}
    steps:
      - name: Check out sources for action
        uses: 'actions/checkout@v4'
        with:
          path: ./buildroot-for-workflow
      - name: Get the refs
        id: build-refs
        uses: './buildroot-for-workflow/.github/actions/build-refs'
        with:
          token: ${{ github.token }}
          monorepo: ${{ inputs.monorepo-ref }}
          buildroot: ${{ inputs.buildroot-ref }}
          monorepo-repo: ${{ case(inputs.monorepo-is-fork, 'opentrons-ot2', 'opentrons')}}
      - name: Add refs to the summary
        run: |
          echo "### Decide refs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **buildroot** | ${{ steps.build-refs.outputs.buildroot }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **monorepo ref** | ${{ steps.build-refs.outputs.monorepo }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **monorepo repo** | ${{ steps.build-refs.outputs.monorepo-repo }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **variant** | ${{ steps.build-refs.outputs.variant }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **build type** | ${{ steps.build-refs.outputs.build-type }} |" >> "$GITHUB_STEP_SUMMARY"

  initialize-infra:
    name: initialize build infrastructure
    needs: decide-refs
    runs-on: ubuntu-latest
    outputs:
      runner_labels: ${{ case(needs.decide-refs.outputs.monorepo-repo != 'opentrons-ot2' && inputs.force-ephemeral-infra == false, steps.static-runner.outputs.runner_labels, needs.decide-refs.outputs.monorepo-repo != 'opentrons-ot2' && inputs.force-ephemeral-infra == true, steps.request-unforked-ephemeral-runner.outputs.runner_labels, needs.decide-refs.outputs.monorepo-repo == 'opentrons-ot2', steps.request-forked-ephemeral-runner.outputs.runner_labels, '[\"unknown infra stage\"]') }}
      runner_group: ${{ case(inputs.force-ephemeral-infra || needs.decide-refs.outputs.monorepo-repo == 'opentrons-ot2', 'ephemeral-system-builders', 'Custom Runners') }}
    steps:
      - id: request-unforked-ephemeral-runner
        name: Request merged-stack ephemeral runner
        if: ${{ inputs.monorepo-is-fork == false && inputs.force-ephemeral-infra == true }}
        env:
          # Set these repo secrets:
          # - EPHEMERAL_RUNNER_API_URL_PROD
          # - EPHEMERAL_RUNNER_API_URL_DEV
          API_URL: ${{ inputs.infra-stage == 'stage-dev' && secrets.EPHEMERAL_RUNNER_UNFORKED_API_URL_DEV || secrets.EPHEMERAL_RUNNER_UNFORKED_API_URL_PROD }}
          INFRA_STAGE: ${{ inputs.infra-stage }}
          VARIANT: ${{ needs.decide-refs.outputs.variant }}
          # Ephemeral runner per attempt (re-runs create a new runner)
          RUNNER_LABEL: ephemeral-${{ github.run_id }}-${{ github.run_attempt }}
          MAX_ATTEMPTS: ${{ inputs.runner-request-max-attempts }}
          RETRY_SECONDS: ${{ inputs.runner-request-retry-seconds }}
        run: |
          set -euo pipefail
          request_start_epoch="$(date +%s)"
          retries_on_429=0
          final_attempt=0

          if [[ -z "${API_URL:-}" ]]; then
            echo "Missing EPHEMERAL_RUNNER_UNFORKED_API_URL_* secret for infra-stage=${INFRA_STAGE}" >&2
            exit 1
          fi

          echo "runner_labels=[\"${RUNNER_LABEL}\"]" >> "$GITHUB_OUTPUT"
          echo "Requesting runner with unique label: [${RUNNER_LABEL}]"

          # Request an ephemeral runner that matches the existing build job labels
          # plus a unique label so only THIS workflow run can claim it.
          repo_label="${GITHUB_REPOSITORY##*/}"
          LABELS_JSON=$(
            REPO_LABEL="${repo_label}" python3 -c 'import json,os; print(json.dumps(["x64","linux-x64","sb-x64", os.environ["INFRA_STAGE"], os.environ["VARIANT"], os.environ["RUNNER_LABEL"], os.environ["REPO_LABEL"]]))'
          )
          echo "Requested labels: ${LABELS_JSON}"

          emit_request_summary() {
            local status="$1"
            local now_epoch elapsed_seconds waited_seconds
            now_epoch="$(date +%s)"
            elapsed_seconds="$((now_epoch - request_start_epoch))"
            waited_seconds="$((retries_on_429 * RETRY_SECONDS))"
            {
              echo "### Runner Request Metrics (unforked)"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Status | ${status} |"
              echo "| Final HTTP status | ${http_code:-n/a} |"
              echo "| Attempts used | ${final_attempt}/${MAX_ATTEMPTS} |"
              echo "| 429 retries | ${retries_on_429} |"
              echo "| Retry wait seconds | ${waited_seconds} |"
              echo "| Total elapsed seconds | ${elapsed_seconds} |"
              echo "| Runner label | ${RUNNER_LABEL} |"
              echo "| Infra stage | ${INFRA_STAGE} |"
              echo "| Variant | ${VARIANT} |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          }

          requested=false
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            final_attempt="${attempt}"
            http_code="$(
              curl -sS -o /tmp/request-runner-response.json -w "%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -d "{\"labels\":${LABELS_JSON},\"workflow_run_id\":\"${GITHUB_RUN_ID}\",\"repository\":\"${GITHUB_REPOSITORY}\"}" \
                "${API_URL%/}/request-runner"
            )"
            if [[ "${http_code}" == "200" ]]; then
              requested=true
              break
            fi
            if [[ "${http_code}" == "429" ]]; then
              retries_on_429="$((retries_on_429 + 1))"
              echo "Runner capacity full (429), waiting ${RETRY_SECONDS}s before retry (${attempt}/${MAX_ATTEMPTS})..."
              sleep "${RETRY_SECONDS}"
              continue
            fi
            emit_request_summary "failed"
            echo "Runner request failed with HTTP ${http_code}" >&2
            cat /tmp/request-runner-response.json >&2 || true
            exit 1
          done
          if [[ "${requested}" != "true" ]]; then
            emit_request_summary "timed_out"
            echo "Timed out waiting for ephemeral runner capacity after ${MAX_ATTEMPTS} attempts." >&2
            exit 1
          fi
          emit_request_summary "success"
      - id: request-forked-ephemeral-runner
        name: Request OT-2 fork stack ephemeral runners
        if: ${{ inputs.monorepo-is-fork == true }}
        env:
          # Set these repo secrets:
          # - EPHEMERAL_RUNNER_FORKED_API_URL_PROD
          # - EPHEMERAL_RUNNER_FORKED_API_URL_DEV
          API_URL: ${{ inputs.infra-stage == 'stage-dev' && secrets.EPHEMERAL_RUNNER_FORKED_API_URL_DEV || secrets.EPHEMERAL_RUNNER_FORKED_API_URL_PROD }}
          INFRA_STAGE: ${{ inputs.infra-stage }}
          VARIANT: ${{ needs.decide-refs.outputs.variant }}
          # Ephemeral runner per attempt (re-runs create a new runner)
          RUNNER_LABEL: ephemeral-${{ github.run_id }}-${{ github.run_attempt }}
          MAX_ATTEMPTS: ${{ inputs.runner-request-max-attempts }}
          RETRY_SECONDS: ${{ inputs.runner-request-retry-seconds }}
        run: |
          set -euo pipefail
          request_start_epoch="$(date +%s)"
          retries_on_429=0
          final_attempt=0

          if [[ -z "${API_URL:-}" ]]; then
            echo "Missing EPHEMERAL_RUNNER_API_FORKED_URL_* secret for infra-stage=${INFRA_STAGE}" >&2
            exit 1
          fi

          echo "runner_labels=[\"${RUNNER_LABEL}\"]" >> "$GITHUB_OUTPUT"
          echo "Requesting runner with unique label: ${RUNNER_LABEL}"

          # Request an ephemeral runner that matches the existing build job labels
          # plus a unique label so only THIS workflow run can claim it.
          repo_label="${GITHUB_REPOSITORY##*/}"
          LABELS_JSON=$(
            REPO_LABEL="${repo_label}" python3 -c 'import json,os; print(json.dumps(["x64","linux-x64","sb-x64", os.environ["INFRA_STAGE"], os.environ["VARIANT"], os.environ["RUNNER_LABEL"], os.environ["REPO_LABEL"]]))'
          )
          echo "Requested labels: ${LABELS_JSON}"

          emit_request_summary() {
            local status="$1"
            local now_epoch elapsed_seconds waited_seconds
            now_epoch="$(date +%s)"
            elapsed_seconds="$((now_epoch - request_start_epoch))"
            waited_seconds="$((retries_on_429 * RETRY_SECONDS))"
            {
              echo "### Runner Request Metrics (forked)"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Status | ${status} |"
              echo "| Final HTTP status | ${http_code:-n/a} |"
              echo "| Attempts used | ${final_attempt}/${MAX_ATTEMPTS} |"
              echo "| 429 retries | ${retries_on_429} |"
              echo "| Retry wait seconds | ${waited_seconds} |"
              echo "| Total elapsed seconds | ${elapsed_seconds} |"
              echo "| Runner label | ${RUNNER_LABEL} |"
              echo "| Infra stage | ${INFRA_STAGE} |"
              echo "| Variant | ${VARIANT} |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          }

          requested=false
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            final_attempt="${attempt}"
            http_code="$(
              curl -sS -o /tmp/request-runner-response.json -w "%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -d "{\"labels\":${LABELS_JSON},\"workflow_run_id\":\"${GITHUB_RUN_ID}\",\"repository\":\"${GITHUB_REPOSITORY}\"}" \
                "${API_URL%/}/request-runner"
            )"
            if [[ "${http_code}" == "200" ]]; then
              requested=true
              break
            fi
            if [[ "${http_code}" == "429" ]]; then
              retries_on_429="$((retries_on_429 + 1))"
              echo "Runner capacity full (429), waiting ${RETRY_SECONDS}s before retry (${attempt}/${MAX_ATTEMPTS})..."
              sleep "${RETRY_SECONDS}"
              continue
            fi
            emit_request_summary "failed"
            echo "Runner request failed with HTTP ${http_code}" >&2
            cat /tmp/request-runner-response.json >&2 || true
            exit 1
          done
          if [[ "${requested}" != "true" ]]; then
            emit_request_summary "timed_out"
            echo "Timed out waiting for ephemeral runner capacity after ${MAX_ATTEMPTS} attempts." >&2
            exit 1
          fi
          emit_request_summary "success"
      - id: static-runner
        name: Select merged-stack static runners
        if: ${{ inputs.monorepo-is-fork == false && inputs.force-ephemeral-infra == false }}
        run: |
          echo "runner_labels=[\"self-hosted\", \"${{inputs.infra-stage}}\", \"${{needs.decide-refs.outputs.variant}}\"]" >> "$GITHUB_OUTPUT"

  # Build job runs on ephemeral or static runner per initialize-infra
  run-build:
    needs: [decide-refs, initialize-infra]
    name: 'Building ${{needs.decide-refs.outputs.variant}} images on ${{ inputs.infra-stage }}'
    timeout-minutes: 480
    runs-on:
      group: ${{ needs.initialize-infra.outputs.runner_group }}
      labels: ${{ fromJSON(needs.initialize-infra.outputs.runner_labels) }}
    concurrency:
      group: build-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    outputs:
      console_url: ${{ steps.upload-results.outputs.console_url }}
      system_url: ${{ steps.upload-results.outputs.system_url }}
      fullimage_url: ${{ steps.upload-results.outputs.fullimage_url }}
      version_file_url: ${{ steps.upload-results.outputs.version_file_url }}
      release_notes_file_url: ${{ steps.upload-results.outputs.release_notes_file_url }}
    steps:
      - name: Set up vm requirements
        run: |
          # Ephemeral runners may not permit writing /etc/sysctl*; apply runtime settings.
          apply_sysctl() {
            local key="$1"
            local value="$2"
            if command -v sudo >/dev/null 2>&1; then
              sudo sysctl -w "${key}=${value}" || sysctl -w "${key}=${value}" || true
            else
              sysctl -w "${key}=${value}" || true
            fi
          }

          apply_sysctl fs.inotify.max_user_watches 655360
          apply_sysctl fs.inotify.max_user_instances 1280
          apply_sysctl fs.file-max 100000
      - name: Fetch initial sources for action
        uses: 'actions/checkout@v3'
        with:
          fetch-depth: 0
          path: ./buildroot-for-workflow
      - name: Fetch buildroot source
        uses: 'actions/checkout@v3'
        with:
          fetch-depth: 0
          ref: ${{needs.decide-refs.outputs.buildroot}}
          path: ./buildroot
      - name: Fetch upstream buildroot if needed
        run: |
          cd ./buildroot
          if [ -e buildroot-upstream-ref ] ; then
            ./checkout-buildroot.sh
          fi
      - name: Fetch monorepo source
        uses: 'actions/checkout@v3'
        with:
          fetch-depth: 0
          ref: ${{ needs.decide-refs.outputs.monorepo }}
          repository: ${{ format('Opentrons/{0}', needs.decide-refs.outputs.monorepo-repo) }}
          path: ./opentrons
      - name: Configure AWS Credentials
        uses: './buildroot-for-workflow/.github/actions/aws-credentials'
        id: aws
        with:
          access_key_id: ${{ secrets.ROBOT_STACK_AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.ROBOT_STACK_AWS_SECRET_ACCESS_KEY }}
          region: us-east-2
          stage: ${{ inputs.infra-stage }}

      - name: Pull or create cache locations
        id: cache-setup
        run: |
          cachedir="${LOCAL_CACHE:-./cache}"
          for cachetype in downloads ccache output ; do
            absdir="${cachedir}/${cachetype}"
            mkdir -p "${absdir}"
            echo "${cachetype}=${absdir}" >> $GITHUB_OUTPUT
            here=$(pwd)
            reldir=$(realpath --relative-to=${here} ${cachedir}/${cachetype})
            echo "Created ${cachetype} cache at ${absdir} (${reldir})"
            echo "${cachetype}-rel=${reldir}" >> $GITHUB_OUTPUT
          done

      - name: Pull S3 cache
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          aws_cp="aws --profile=${{ steps.aws.outputs.profile_name }} s3 cp --no-progress"
          cachedir=${LOCAL_CACHE:-./cache}
          cache_prefix=ot2-br

          for cachetype in downloads ccache ; do
            thiscache="${cachedir}/${cachetype}"
            localzip="${cachedir}/../${cache_prefix}-${cachetype}.zip"
            remotezip="s3://${S3_CACHE_ARN/arn:aws:s3:::/}/${cache_prefix}/${cachetype}.zip"

            mkdir -p "${thiscache}"
            echo "Fetching cache ${remotezip} -> ${localzip}"
            if ${aws_cp} "${remotezip}" "${localzip}" ; then
              echo "Extracting ${localzip} -> ${thiscache}"
              unzip -q -u -o "${localzip}" -d "${thiscache}"
              rm -f "${localzip}"
            else
              echo "No cache found at ${remotezip} (continuing)"
            fi
          done
      - name: Set up docker environment file
        id: docker-env
        run: |
          cat <<EOF >./docker-envfile
          OT_BUILD_TYPE=${{needs.decide-refs.outputs.build-type}}
          FORCE_UNSAFE_CONFIGURE=1
          BR2_DL_DIR=/downloads
          EOF
          echo "envfile=$(pwd)/docker-envfile" >> $GITHUB_OUTPUT

      - name: Build or download docker container
        id: get-image
        run: |
          cd buildroot
          if [ "${{inputs.force-own-container}}" = "true" ] ; then
            imgname=$(./opentrons-build-container.sh build)
          else
            imgname=$(./opentrons-build-container.sh pull || ./opentrons-build-container.sh build)
          fi
          echo "image-name=$imgname" >> $GITHUB_OUTPUT

      - name: Set up signing
        if: needs.decide-refs.outputs.build-type == 'release'
        run: |
          echo "${{secrets.ROBOT_SIGNING_KEY}}" > ./buildroot/.signing-key

      - name: Set up docker args
        id: docker-args
        run: |
          if [ "${{needs.decide-refs.outputs.variant}}" = "release" ] ; then
             _project=robot-stack
          else
            _project=ot3
          fi
          echo "Stack name ${_project} from variant ${{needs.decide-refs.outputs.variant}}"
          mount_args="type=bind,consistency=delegated"
          bind_ot="--mount source=$(pwd)/opentrons,destination=/opentrons,${mount_args}"
          bind_dl="--mount source=${{steps.cache-setup.outputs.downloads}},destination=/downloads,${mount_args}"
          bind_ccache="--mount source=${{steps.cache-setup.outputs.ccache}},destination=/ccache,${mount_args}"
          bind_op="--mount source=${{steps.cache-setup.outputs.output}},destination=/output,${mount_args}"
          if [ -e ./buildroot/buildroot-upstream-ref ] ; then
             echo "New-style overlay build"
             bind_up="--mount source=$(pwd)/buildroot-upstream,destination=/buildroot,${mount_args}"
             bind_br="--mount source=$(pwd)/buildroot,destination=/buildroot-overlays,${mount_args}"
             entry="--entrypoint=/buildroot-overlays/in_docker.sh"
          else
             echo "Old-style in-tree build"
             bind_br="--mount source=$(pwd)/buildroot,destination=/buildroot,${mount_args}"
             bind_up=
             entry=
          fi
          binds="${bind_br} ${bind_ot} ${bind_dl} ${bind_ccache} ${bind_op} ${bind_up}"
          env="--env-file ${{steps.docker-env.outputs.envfile}}"
          echo "run-binds=${binds}" >> $GITHUB_OUTPUT
          echo "env=${env}" >> $GITHUB_OUTPUT
          args="${binds} ${env} ${entry} ${{steps.get-image.outputs.image-name}} O=/output OPENTRONS_PROJECT=${_project}"
          echo "args=${args}" >> $GITHUB_OUTPUT

      - name: Configure
        run: |
          cd buildroot
          docker run ${{steps.docker-args.outputs.args}} ot2_defconfig

      - name: Hackily delete incorrectly-cached module firmwares
        # the arduino module firmwares do not have their versions as part of their filenames, which means
        # that buildroot will not detect previously-downloaded (and previously-versioned) module firmware packages
        # as stale and update them. Since they are also tiny, just neatly brush them away before doing a build to
        # force a redownload.
        # because buildroot is Like That, brushing them away requires manually poking in the output build directory
        # and removing the cache there too; removing the downloaded artifact isn't enough. There also isn't a
        # per-recipe clean step.
        run: |
          echo "Downloads before delete"
          ls ${{steps.cache-setup.outputs.downloads}}
          rm -rf ${{steps.cache-setup.outputs.downloads}}/opentrons-temperature-module-firmware
          rm -rf ${{steps.cache-setup.outputs.downloads}}/opentrons-magnetic-module-firmware
          echo "Downloads after delete"
          ls ${{steps.cache-setup.outputs.downloads}}
          if [ -d ${{steps.cache-setup.outputs.output}}/build ] ; then
            echo "Build before delete"
            ls ${{steps.cache-setup.outputs.output}}/build
            rm -rf ${{steps.cache-setup.outputs.output}}/build/opentrons-temperature-module-firmware-*
            rm -rf ${{steps.cache-setup.outputs.output}}/build/opentrons-magnetic-module-firmware-*
            echo "Build after delete"
            ls ${{steps.cache-setup.outputs.output}}/build
          else
            echo "No output/builds in"
            ls ${{steps.cache-setup.outputs.output}}
          fi
      - name: Download package sources
        run: |
          cd buildroot
          docker run ${{steps.docker-args.outputs.args}} source
      - name: Run build
        run: |
          cd buildroot
          docker run ${{steps.docker-args.outputs.args}} all
      - name: Push S3 cache
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          aws_cp="aws --profile=${{ steps.aws.outputs.profile_name }} s3 cp --no-progress"
          cachedir=${LOCAL_CACHE:-./cache}
          cache_prefix=ot2-br

          for cachetype in downloads ccache ; do
            thiscache="${cachedir}/${cachetype}"
            localzip="${cachedir}/../${cache_prefix}-${cachetype}.zip"
            remotezip="s3://${S3_CACHE_ARN/arn:aws:s3:::/}/${cache_prefix}/${cachetype}.zip"

            if [ ! -d "${thiscache}" ]; then
              echo "Cache dir ${thiscache} does not exist; skipping upload"
              continue
            fi

            df -h || true
            echo "Refreshing cache for ${cachetype} from ${thiscache} -> ${localzip}"
            rm -f "${localzip}"
            pushd "${thiscache}" >/dev/null
            zip -q -r --filesync --symlinks "${localzip}" ./*
            popd >/dev/null

            echo "Uploading ${localzip} -> ${remotezip}"
            ${aws_cp} "${localzip}" "${remotezip}"
            rm -f "${localzip}"
          done
      - name: Upload build log result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog.txt
          path: ./buildroot/buildlog.txt
      - name: Prep artifacts for upload
        id: artifact-copy
        run: |
          artifact_dir="${{steps.cache-setup.outputs.output}}/images"

          prepped_artifact_dir="${{steps.cache-setup.outputs.output}}/unversioned_artifacts"
          mkdir -p ${prepped_artifact_dir}
          echo "prepped_artifact_dir=${prepped_artifact_dir}" >> $GITHUB_OUTPUT
          versioned_artifact_dir_rel="./versioned_artifacts"
          versioned_artifact_dir=$(realpath ${versioned_artifact_dir_rel})
          mkdir -p ${versioned_artifact_dir}
          echo "versioned_artifact_dir=${versioned_artifact_dir}" >> $GITHUB_OUTPUT
          echo "versioned_artifact_dir_rel=${versioned_artifact_dir_rel}" >> $GITHUB_OUTPUT

          _fulltag="${{needs.decide-refs.outputs.monorepo}}"
          echo "monorepo_shorttag=${_fulltag:10}" >> $GITHUB_OUTPUT
          _vers_tag=${{needs.decide-refs.outputs.variant == 'release' && '${_fulltag:11}' || '${_fulltag:14}'}}

          cp ${artifact_dir}/ot2-system.zip ${prepped_artifact_dir}/ot2-system.zip
          echo "ot2_system=${prepped_artifact_dir}/ot2-system.zip" >> $GITHUB_OUTPUT

          cp ${artifact_dir}/ot2-fullimage.zip ${prepped_artifact_dir}/ot2-fullimage.zip
          echo "ot2_fullimage=${prepped_artifact_dir}/ot2-fullimage.zip" >> $GITHUB_OUTPUT

          cp ${artifact_dir}/VERSION.json ${prepped_artifact_dir}/VERSION.json
          echo "version_json=${prepped_artifact_dir}/VERSION.json" >> $GITHUB_OUTPUT

          cp ${artifact_dir}/release-notes.md ${prepped_artifact_dir}/release-notes.md
          echo "release_notes=${prepped_artifact_dir}/release-notes.md" >> $GITHUB_OUTPUT

          versioned_system_zip="ot2-system-${_vers_tag}.zip"
          cp ${artifact_dir}/ot2-system.zip "${versioned_artifact_dir}/${versioned_system_zip}"
          echo "ot2_system_versioned=${versioned_artifact_dir}/${versioned_system_zip}" >> $GITHUB_OUTPUT

          versioned_fullimage_zip="ot2-fullimage-${_vers_tag}.zip"
          cp ${artifact_dir}/ot2-fullimage.zip ${versioned_artifact_dir}/${versioned_fullimage_zip}
          echo "ot2_fullimage_versioned=${versioned_artifact_dir}/${versioned_fullimage_zip}" >> $GITHUB_OUTPUT

          versioned_version_json="VERSION-ot2-${_vers_tag}.json"
          cp ${artifact_dir}/VERSION.json ${versioned_artifact_dir}/${versioned_version_json}
          echo "version_json_versioned=${versioned_artifact_dir}/${versioned_version_json}" >> $GITHUB_OUTPUT

          echo "Prepared unversioned artifacts: $(find ${prepped_artifact_dir}/)"
          echo "Prepared versioned artifacts: $(find ${versioned_artifact_dir}/)"

      - name: Upload results to S3
        shell: bash
        id: 'upload-results'
        run: |
          prefix=ot2-br
          arnslug=${S3_ARTIFACT_ARN/arn:aws:s3:::/}
          root_uri=${arnslug}/${prefix}/${{github.run_id}}

          pushd ${{steps.artifact-copy.outputs.prepped_artifact_dir}}
          aws --profile=${{ steps.aws.outputs.profile_name }} s3 cp --recursive --acl=public-read . s3://${root_uri}/

          root_url=https://${root_uri}
          echo "console_url=https://s3.console.aws.amazon.com/s3/buckets/${arnslug}?prefix=${{github.run_id}}" >> $GITHUB_OUTPUT
          echo "version_file_url=$root_url/VERSION.json" >> $GITHUB_OUTPUT
          echo "release_notes_file_url=$root_url/release-notes.md" >> $GITHUB_OUTPUT
          echo "system_url=$root_url/ot2-system.zip" >> $GITHUB_OUTPUT
          echo "fullimage_url=$root_url/ot2-fullimage.zip" >> $GITHUB_OUTPUT
          echo "arnslug=$arnslug" >> $GITHUB_OUTPUT
          echo "root_uri=$root_uri" >> $GITHUB_OUTPUT
          echo "root_url=$root_url" >> $GITHUB_OUTPUT
          echo "root_prefix=ot2-br" >> $GITHUB_OUTPUT
          echo "machine_root=${arnslug}/${prefix}" >> $GITHUB_OUTPUT
          popd
      - name: Handle release manifest
        if: ${{ needs.decide-refs.outputs.build-type == 'release' }}
        shell: bash
        run: |
          pushd buildroot
          aws --profile=${{ steps.aws.outputs.profile_name }} s3 cp --acl=public-read s3://${{steps.upload-results.outputs.machine_root}}/releases.json releases.json || echo '{"production":{}}' > releases.json
          python3 update_releases_file.py --releases-file releases.json --version-file ${{steps.artifact-copy.outputs.version_json}} --base-url ${{ steps.upload-results.outputs.root_url }}
          aws --profile=${{ steps.aws.outputs.profile_name }} s3 cp --acl=public-read releases.json s3://${{steps.upload-results.outputs.machine_root}}/releases.json
          popd

      - name: Upload system zip to monorepo release
        if: needs.decide-refs.outputs.build-type == 'release'
        uses: 'ncipollo/release-action@v1.12.0'
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          omitPrereleaseDuringUpdate: true
          omitDraftDuringUpdate: true
          repo: ${{ needs.decide-refs.outputs.monorepo-repo }}
          tag: ${{ steps.artifact-copy.outputs.monorepo_shorttag }}
          artifacts: "${{steps.artifact-copy.outputs.versioned_artifact_dir_rel}}/ot2-*.zip"
          artifactContentType: application/zip
          token: ${{secrets.MONOREPO_RELEASE_ARTIFACT_UPLOAD_TOKEN}}
      - name: Upload version json to monorepo release
        if: needs.decide-refs.outputs.build-type == 'release'
        uses: 'ncipollo/release-action@v1.12.0'
        with:
          allowUpdates: true
          omitBody: true
          omitName: true
          omitPrereleaseDuringUpdate: true
          omitDraftDuringUpdate: true
          repo: ${{ needs.decide-refs.outputs.monorepo-repo }}
          tag: ${{ steps.artifact-copy.outputs.monorepo_shorttag }}
          artifacts: "${{steps.artifact-copy.outputs.versioned_artifact_dir_rel}}/VERSION-*.json"
          artifactContentType: application/json
          token: ${{secrets.MONOREPO_RELEASE_ARTIFACT_UPLOAD_TOKEN}}

